name: Publish Unstable Docker Image

on:
  push:
    branches:
      - master

permissions:
  contents: read
  packages: write

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  publish:
    needs: checks
    runs-on: ubuntu-latest
    concurrency:
      group: docker-publish-${{ github.repository }}
      cancel-in-progress: false
      queue: max

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push unstable Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          cache-from: type=gha,scope=docker-image
          cache-to: type=gha,mode=max,scope=docker-image
          build-args: |
            HOOK_VERSION=${{ github.sha }}
          tags: |
            ghcr.io/${{ github.repository }}:unstable
